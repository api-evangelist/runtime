aid: runtime
name: Runtime
description: >-
  Runtime (runtm.com) is a Y Combinator-backed platform (Spring 2026) that lets engineering and
  non-engineering teams safely run coding agents across an organization. It provides sandboxed
  per-session VMs, session-level observability, and configurable guardrails so teams can ship with
  agents like Claude Code, OpenAI Codex, and Gemini without breaking production. The hosted Runtime
  Cloud API (app.runtm.com/api/cloud) exposes sessions, templates, deployments, guardrails, secrets,
  knowledge and skill directives, and activity telemetry behind scoped bearer-token API keys, with a
  first-party CLI (runtm) and an agent-focused CLI (runtm-api).
